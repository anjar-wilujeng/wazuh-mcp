[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuh-mcp"
version = "0.1.0"
description = "Wazuh MCP Server for SOC teams"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.8.1",
    "httpx==0.28.1",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "python-dotenv==1.1.0",
    "tenacity==9.1.2",
    "uvicorn==0.44.0",
    "starlette==1.0.0",
]

[project.scripts]
wazuh-mcp = "wazuh_mcp.server:main"
wazuh-mcp-http = "wazuh_mcp.server:main_http"

[tool.setuptools.packages.find]
where = ["src"]
